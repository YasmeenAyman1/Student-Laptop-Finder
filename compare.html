<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare | Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="flex min-h-screen flex-col bg-page text-ink">
  <div id="site-header"></div>
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <h1 class="mb-2 text-3xl font-bold">Compare laptops</h1>
    <p class="mb-4 text-muted">Pick 2 to 4 of your favorites. The best value in each row is highlighted.</p>
    <section id="picker" class="flex flex-wrap gap-3"></section>
    <p id="msg" class="my-3 text-sm font-semibold text-accent" aria-live="polite"></p>
    <section id="table" class="overflow-x-auto rounded-xl border border-line bg-card"></section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="src/js/compare-page.js"></script>
</body>
</html>
